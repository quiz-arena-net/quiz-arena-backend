[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
quiz-arena-shared = { path = "crates/shared" }
quiz-arena-proto = { path = "crates/proto" }

anyhow = "1"
async-trait = "0.1.91"
axum = "0.8.9"
axum-otel-metrics = "0.14.1"
buffa = { version = "0.8.1", features = ["json"] }
buffa-types = { version = "0.8.1", features = ["json"] }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
connectrpc = { version = "0.8.1", features = ["axum"] }
connectrpc-build = "0.8.0"
connectrpc-health = "0.8.0"
connectrpc-reflection = "0.8.0"
log = "0.4.33"
opentelemetry = "0.32.0"
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-http = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "trace", "metrics", "logs", "internal-logs"] }
opentelemetry-resource-detectors = "0.11.0"
opentelemetry_sdk = "0.32.1"
sea-orm = { version = "2", default-features = false, features = ["sqlx-sqlite", "sqlx-mysql", "runtime-tokio-rustls", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
