services:
  postgres:
    image: docker.io/library/postgres:18
    container_name: quiz-arena-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
  lgtm:
    image: docker.io/grafana/otel-lgtm:latest
    container_name: quiz-arena-backend-grafana-lgtm
    restart: unless-stopped
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - lgtm-data:/data
volumes:
  postgres-data:
  lgtm-data:
